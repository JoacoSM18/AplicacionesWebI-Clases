<!-- Indica el tipo de docuemento para el navegador -->
<!DOCTYPE html>

<!-- Es un atributo que determina el idioma. Es la raiz tambien -->
<html lang="es">

    <!-- Contiene Metadatos que no se ven -->
    <head>

        <!-- Es un atributo, indica la codificacion -->
        <meta charset="UTF-8">

        <!-- Es otro atributo, se utiliza para que se vea bien en celulares -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Indica el titulo de la pagina en el navegador -->
        <title>Actividad 4 - AW1</title>
    </head>

    <!-- Contiene lo que se ve -->
    <body>

        <!-- Es el titulo principal -->
        <h1>
            Es utilizado para lo mas importante, el titulo, hay solo uno
        </h1>
        <h2>
            Es menos importante que el H1
        </h2>
        <h3>
            Es menos importante que el H2 y va disminuyendo el tamaño
        </h3>
        <h4>
            <p>
                Esto es un parrafo, mas chico aun
            </p>
        </h4>
    </body>
</html>

<!-- 
    "index" es el nombre que los servidores web buscan automáticamente 
    cuando alguien entra a una carpeta o dominio sin especificar un archivo.
    El servidor internamente busca un archivo llamado index dentro de esa 
    carpeta y lo carga solo, sin tener que escribir la ruta en la URL. 
-->
